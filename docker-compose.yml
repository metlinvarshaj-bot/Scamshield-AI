version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=scamshield_docker_secret_key_2026
      - DATABASE_URL=sqlite:///./scamshield.db
      - LLM_PROVIDER=gemini
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    restart: unless-stopped
